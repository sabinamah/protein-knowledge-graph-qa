# Brings up Neo4j and the QA API together. The NL->Cypher backend is chosen by
# LLM_BACKEND: "template" (default, no model needed), or "openai" pointing at a
# self-managed vLLM / inference gateway via OPENAI_BASE_URL.
services:
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/thesisgraph123
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: serving/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=thesisgraph123
      - LLM_BACKEND=${LLM_BACKEND:-template}
      # Used when LLM_BACKEND=openai (point at your vLLM / gateway):
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://localhost:8000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen2.5-7B-Instruct}
    depends_on:
      neo4j:
        condition: service_healthy
